services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: terraplane
      POSTGRES_PASSWORD: terraplane
      POSTGRES_DB: terraplane
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraplane -d terraplane"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    image: terraplane
    command: ["db", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://terraplane:terraplane@postgres:5432/terraplane?sslmode=disable
    env_file:
      - .env

  orchestrator:
    build: .
    image: terraplane
    command: ["orchestrator"]
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "8080:8080"
    environment:
      ORCHESTRATOR_LISTEN_ADDRESS: 0.0.0.0
      ORCHESTRATOR_LISTEN_PORT: "8080"
      DATABASE_DRIVER: postgres
      DATABASE_URL: postgres://terraplane:terraplane@postgres:5432/terraplane?sslmode=disable
    env_file:
      - .env

  agent-dev:
    image: terraplane
    command: ["agent"]
    depends_on:
      orchestrator:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${AGENT_SCM_SSH_KEY_PATH:?Set AGENT_SCM_SSH_KEY_PATH in .env to your deploy key path}:/run/secrets/git_ssh_key:ro
      - agent-dev-work:/var/terraplane/work
    environment:
      AGENT_ID: "agent-dev"
      AGENT_ORCHESTRATOR_URL: "ws://orchestrator:8080/ws"
      AGENT_SCM_SSH_KEY_PATH: /run/secrets/git_ssh_key
      AGENT_WORK_DIR: /var/terraplane/work
      AGENT_TERRAFORM_BIN_DIR: /var/terraplane/work/terraform

  agent-prod:
    image: terraplane
    command: ["agent"]
    depends_on:
      orchestrator:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ${AGENT_SCM_SSH_KEY_PATH:?Set AGENT_SCM_SSH_KEY_PATH in .env to your deploy key path}:/run/secrets/git_ssh_key:ro
      - agent-prod-work:/var/terraplane/work
    environment:
      AGENT_ID: "agent-prod"
      AGENT_ORCHESTRATOR_URL: "ws://orchestrator:8080/ws"
      AGENT_SCM_SSH_KEY_PATH: /run/secrets/git_ssh_key
      AGENT_WORK_DIR: /var/terraplane/work
      AGENT_TERRAFORM_BIN_DIR: /var/terraplane/work/terraform

volumes:
  agent-dev-work:
  agent-prod-work:
  postgres-data:
