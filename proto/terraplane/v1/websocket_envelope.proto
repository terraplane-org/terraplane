syntax = "proto3";

package terraplane.v1;

option go_package = "github.com/xyzjace/terraplane/pkg/terraplane/v1;terraplanev1";

import "terraplane/v1/terraform_envelope.proto";

// WebsocketEnvelope is the sole message root on the agent↔orchestrator WebSocket.
message WebsocketEnvelope {
  oneof payload {
    Hello hello = 1;
    Goodbye goodbye = 2;
    Ping ping = 3;
    Pong pong = 4;
    TerraformEnvelope terraform = 5;
  }
}
message Hello {
  string agent_id = 1;
}
message Goodbye {
  string agent_id = 1;
}
message Ping {}
message Pong {}
