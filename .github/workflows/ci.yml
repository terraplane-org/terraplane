name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9.2.1
        with:
          version: latest

  vuln:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1.0.4
        with:
          repo-checkout: false

  mod-tidy:
    name: go mod tidy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run tests
        run: make unit-test

      - name: Coverage summary
        if: always()
        run: |
          if [ ! -f coverage.out ]; then
            echo "## Coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "No coverage.out produced (tests likely failed before coverage was written)." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "## Coverage"
            echo '```'
            go tool cover -func=coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          go tool cover -html=coverage.out -o coverage.html

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
          if-no-files-found: ignore

  migrations:
    name: Validate migrations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Install Atlas
        run: |
          curl -sSfL https://release.ariga.io/atlas/atlas-linux-amd64-latest -o /usr/local/bin/atlas
          chmod +x /usr/local/bin/atlas

      - name: Validate migration directory
        run: make db-migrate-validate

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Log in to Docker Hub
        if: github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build image
        if: github.ref_name != github.event.repository.default_branch
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: false
          load: true
          tags: terraplane:ci

      - name: Build and push image
        if: github.ref_name == github.event.repository.default_branch
        uses: docker/build-push-action@v7.2.0
        with:
          context: .
          push: true
          tags: xyzjace/terraplane:${{ github.sha }}

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Set up Helm
        uses: azure/setup-helm@v4.3.1

      - name: Lint chart
        run: helm lint charts/terraplane

      - name: Render templates
        run: |
          helm template terraplane charts/terraplane >/dev/null
          helm template terraplane-agents charts/terraplane \
            --set orchestrator.enabled=false \
            --set image.tag=ci \
            --set agentDefaults.orchestratorURL=wss://terraplane.example.com/ws \
            --set 'agents[0].name=agent-dev' \
            >/dev/null

      - name: Log in to Docker Hub
        if: github.ref_name == github.event.repository.default_branch
        uses: docker/login-action@v3.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Package and push chart
        if: github.ref_name == github.event.repository.default_branch
        run: |
          helm package charts/terraplane -d /tmp
          helm push /tmp/terraplane-*.tgz oci://registry-1.docker.io/xyzjace
