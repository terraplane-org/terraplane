{{- if and .Values.orchestrator.enabled .Values.orchestrator.ingress.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "terraplane.fullname" . }}-orchestrator
  namespace: {{ include "terraplane.namespace" . }}
  labels:
    {{- include "terraplane.labels" . | nindent 4 }}
    app.kubernetes.io/component: orchestrator
  {{- with .Values.orchestrator.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.orchestrator.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.orchestrator.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.orchestrator.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "terraplane.fullname" $ }}-orchestrator
                port:
                  number: {{ $.Values.orchestrator.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
