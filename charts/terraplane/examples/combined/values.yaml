# Single-cluster lab install: orchestrator + one agent in the same release.
#
# Agents reach the orchestrator via the in-cluster Service. For release name
# `terraplane`, the Service is `terraplane-orchestrator` (see chart helpers).
# Adjust agentDefaults.orchestratorURL if you use a different release name.
#
# Prerequisites:
#   kubectl create namespace terraplane
#   kubectl -n terraplane create secret generic terraplane-orchestrator \
#     --from-literal=DATABASE_URL='postgres://user:pass@host:5432/terraplane?sslmode=require' \
#     --from-literal=DATABASE_DRIVER=postgres \
#     --from-literal=SHARED_AUTH_TOKEN='change-me' \
#     --from-literal=ORCHESTRATOR_GITHUB_ACCESS_TOKEN='ghp_...' \
#     --from-literal=ORCHESTRATOR_GITHUB_WEBHOOK_SECRET='...'
#   kubectl -n terraplane create secret generic terraplane-agent \
#     --from-literal=SHARED_AUTH_TOKEN='change-me'
#   kubectl -n terraplane create secret generic agent-dev-ssh \
#     --from-file=ssh-private-key=./id_ed25519_dev
#
# SHARED_AUTH_TOKEN must be identical in both secrets.
#
# Install (release name matters for the Service DNS below):
#   helm install terraplane oci://ghcr.io/terraplane-org/charts/terraplane \
#     --version 0.3.1 -n terraplane -f values.yaml
#
# Point GitHub webhooks at your ingress (or port-forward) when ready.

orchestrator:
  enabled: true
  envFrom:
    - secretRef:
        name: terraplane-orchestrator
  # Enable ingress when you need public webhook delivery.
  ingress:
    enabled: false

agentDefaults:
  orchestratorURL: http://terraplane-orchestrator:8080
  envFrom:
    - secretRef:
        name: terraplane-agent

agents:
  - name: agent-dev
    sshKey:
      secretName: agent-dev-ssh
